[project]
name = "lumio-lead-qualification"
version = "0.1.0"
description = "Qualification et routage automatiques des demandes de démo Lumio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic[email]>=2.8",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
